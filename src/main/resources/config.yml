# ==============================================================
#                 localhost-gildie - Konfiguracja
#       Autor: Localhost (discord: localhost_127001)
# ==============================================================

settings:
  # Ograniczenia dlugosci TAGu gildii (np. PRO, KOSA)
  tag-min-length: 2
  tag-max-length: 5

  # Ograniczenia dlugosci pelnej nazwy gildii
  name-min-length: 3
  name-max-length: 16

  # Promien cuboidu terenu gildii liczony od srodka (np. 35 = teren 70x70)
  region-radius: 35

  # Minimalna odleglosc miedzy sercami dwoch gildii (w blokach)
  min-distance-between-guilds: 80

  # Minimalna odleglosc od spawnu (punktu 0,0) wymagana do zalozenia gildii
  min-distance-from-spawn: 150

  # Czas oczekiwania na teleportacje do bazy (/g baza) w sekundach
  teleport-delay: 5

  # Poczatkowa liczba zyc nowej gildii
  default-lives: 3

  # Poczatkowa liczba punktow rankingowych ELO
  default-points: 1000

  # Czas waznosci nowej gildii (w dniach)
  validity-days: 7

  # Blok Serca Gildii stawiany w centrum terenu
  heart-block: "CRYING_OBSIDIAN"

# Koszt zalozenia nowej gildii (/g zaloz)
cost:
  enabled: true
  items:
    DIAMOND: 16
    EMERALD: 16
    GOLD_INGOT: 16
    IRON_INGOT: 32

# Punkty rankingowe za zabojstwa
points:
  kill-gain: 30
  death-loss: 20

